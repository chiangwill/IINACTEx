name: Sample PR Builder for SamplePlugin

on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Download Dalamud (TC)
        run: |
          Invoke-WebRequest -Uri https://github.com/yanmucorp/Dalamud/releases/download/25-12-26-01/latest.7z -OutFile latest.7z
          7z x latest.7z -o"$env:AppData\XIVLauncher\addon\Hooks\dev" -y
      - name: Build with dotnet
        run: dotnet build --configuration Release
      - name: GenVersion
        id: generate_version
        shell: pwsh
        run: |
          $time = (Get-Date).AddHours(8).ToString("yyyyMMddHHmmss")
          echo "VERSION=$time" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.generate_version.outputs.VERSION }}
          name: Release ${{ steps.generate_version.outputs.VERSION }}
          files: |
            ./IINACT/bin/IINACTEx/latest.zip 
            ./IINACT/bin/IINACTEx/IINACTEx.json
          generate_release_notes: true
